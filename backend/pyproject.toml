[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "speakflow-backend"
version = "2.0.0"
description = "SpeakFlow modular-monolith FastAPI backend"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = [
  "auth_api",
  "auth_service",
  "ctc_gop",
  "ctc_pronunciation_service",
  "gector_runtime",
  "main",
  "model_bundle",
  "pronunciation_core",
  "pronunciation_features",
  "roleplay_engine",
  "runtime_env",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["speakflow*", "plp*", "gopt_models*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
